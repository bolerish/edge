packages:
  - packages/*
  - docs

catalog:
  oxfmt: 0.77.0
  oxlint: 1.92.0
  '@stylexjs/stylex': 0.19.1
  '@stylexjs/unplugin': 0.19.1
  turndown: 7.2.5
  '@types/turndown': 5.0.6
  '@testing-library/react': 16.3.3
  '@testing-library/dom': 10.4.2
  '@phosphor-icons/react': 2.1.10
  '@stryker-mutator/core': 10.1.1
  '@stryker-mutator/vitest-runner': 10.1.1
  typescript: 7.0.2
  '@types/node': 22.20.5
  jsdom: 30.1.3
  '@playwright/test': 1.64.1
  '@axe-core/playwright': 4.14.0
  prism-react-renderer: 2.4.1
  prismjs: 1.30.0
  '@types/prismjs': 1.26.6

catalogs:
  2026-11-03--react-stable:
    react: 19.3.1
    react-dom: 19.3.1
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
  2026-11-03--vite-vitest-stable:
    vite: 8.3.5
    vitest: 5.1.0
  2026-11-03--bolerish-stable:
    '@bolerish/ui': 0.18.1
    '@bolerish/tokens': 0.18.1

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vitest@5.1.0
  - '@bolerish/tokens@0.18.1'
  - '@bolerish/ui@0.18.1'

# Stryker's sandbox preprocessor needs the JavaScript compiler API.
# Keep its compatibility dependency separate from the project's native TS 7 compiler.
packageExtensions:
  '@stryker-mutator/core@10.1.1':
    dependencies:
      typescript: 6.0.3
