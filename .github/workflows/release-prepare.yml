name: Release preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.private/playwright-browsers
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bolerish/edge-docs exec playwright install --with-deps chromium
      - run: pnpm release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: verified-packages
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .private/package-check/core.tgz
            .private/package-check/styles.tgz
            .private/package-check/react.tgz
