name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
      LEFTHOOK: '0'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.private/playwright-browsers
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Verify release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          assert(/^\d+\.\d+\.\d+$/.test(version), 'Use a stable release version');
          for (const name of ['core', 'styles', 'react']) {
            const manifest = JSON.parse(readFileSync(`packages/${name}/package.json`, 'utf8'));
            assert.equal(manifest.version, version, `${name} version mismatch`);
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(manifest.name)}/${version}`);
            assert.equal(response.status, 404, `${manifest.name}@${version} must be unused (registry returned ${response.status})`);
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bolerish/edge-docs exec playwright install --with-deps chromium
      - run: pnpm release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: verified-packages-${{ inputs.version }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .private/package-check/core.tgz
            .private/package-check/styles.tgz
            .private/package-check/react.tgz
      - name: Use an npm CLI with Trusted Publisher support
        run: npm install --global npm@12.2.2
      - name: Publish verified archives in dependency order
        run: |
          npm publish .private/package-check/core.tgz --access public --tag latest
          npm publish .private/package-check/styles.tgz --access public --tag latest
          npm publish .private/package-check/react.tgz --access public --tag latest
