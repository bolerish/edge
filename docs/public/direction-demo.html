<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edge · 방향 비교</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--foreground, light-dark(#242424, #ededed));
        font-family: var(--font-sans, system-ui, sans-serif);
        font-size: 14px;
        line-height: 1.6;
      }
      main {
        max-width: 900px;
        margin-inline: auto;
      }
      fieldset {
        border: 0;
        margin: 0 0 16px;
        padding: 0;
      }
      legend {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      label {
        cursor: pointer;
        padding: 8px 14px;
        border: 1px solid var(--border, #8886);
        border-radius: var(--radius, 8px);
      }
      label:has(:checked) {
        background: var(--secondary, light-dark(#eee, #333));
      }
      input {
        accent-color: var(--foreground, light-dark(#242424, #ededed));
        margin-right: 6px;
      }
      p {
        color: var(--muted-foreground, light-dark(#666, #aaa));
        margin: 10px 0 18px;
      }
      .stage {
        position: relative;
        padding: 48px 20px;
        background: var(--card, light-dark(#f7f7f7, #191919));
        border-radius: var(--radius, 12px);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 36px 24px;
      }
      .surface {
        position: relative;
        padding: 24px 16px;
        min-height: 110px;
        border: 1px solid var(--border, #8884);
        border-radius: 12px;
        background: var(--background, light-dark(#fff, #242424));
      }
      .surface::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 2px;
        pointer-events: none;
        background: conic-gradient(
          from calc(var(--angle, 315deg) - 40deg),
          transparent 0deg,
          currentColor 40deg,
          transparent 80deg,
          #0008 220deg,
          transparent 360deg
        );
        opacity: var(--strength, 0.5);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask-composite: exclude;
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
      }
      .surface strong {
        display: block;
        font-size: 16px;
        font-weight: 500;
      }
      .surface small {
        color: var(--muted-foreground, light-dark(#777, #aaa));
      }
      .dot {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--foreground, light-dark(#222, #eee));
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      @media (max-width: 500px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 26px 16px;
        }
        .surface {
          padding: 18px 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <fieldset>
        <legend>빛의 방향 비교</legend>
        <div class="controls">
          <label><input type="radio" name="direction" value="toward" checked />포인터 쪽</label>
          <label><input type="radio" name="direction" value="away" />포인터 반대쪽</label>
        </div>
      </fieldset>
      <p id="description" aria-live="polite">
        밝은 면이 마우스를 향합니다. 카드 사이로 마우스를 움직여 보세요.
      </p>
      <div class="stage" aria-label="마우스 또는 터치로 비교하는 표면 여섯 개">
        <div class="grid">
          <article class="surface"><strong>Projects</strong><small>진행 중인 작업</small></article>
          <article class="surface"><strong>Library</strong><small>모아둔 자료</small></article>
          <article class="surface"><strong>Activity</strong><small>최근 활동</small></article>
          <article class="surface"><strong>Design</strong><small>표면과 빛</small></article>
          <article class="surface"><strong>Notes</strong><small>떠오른 생각</small></article>
          <article class="surface"><strong>Archive</strong><small>지난 기록</small></article>
        </div>
        <span class="dot" aria-hidden="true"></span>
      </div>
      <p>
        같은 배치와 세기에서 밝은 면의 방향만 180° 바꿉니다. 터치 화면에서는 영역을 누르거나
        드래그해 보세요.
      </p>
    </main>
    <script>
      const stage = document.querySelector('.stage');
      const surfaces = [...document.querySelectorAll('.surface')];
      const dot = document.querySelector('.dot');
      const description = document.querySelector('#description');
      let mode = 'toward';
      let point = null;
      let frame = 0;

      function render() {
        frame = 0;
        const area = stage.getBoundingClientRect();
        const source = point ?? { x: area.left + area.width / 2, y: area.top + area.height / 2 };
        const lighting = surfaces.map((surface) => {
          const rect = surface.getBoundingClientRect();
          const dx = source.x - rect.left - rect.width / 2;
          const dy = source.y - rect.top - rect.height / 2;
          const distance = Math.hypot(dx, dy);
          const edgeDistance = Math.hypot(
            Math.max(0, Math.abs(dx) - rect.width / 2),
            Math.max(0, Math.abs(dy) - rect.height / 2),
          );
          return {
            angle: ((Math.atan2(dy, dx) * 180) / Math.PI + 450 + (mode === 'away' ? 180 : 0)) % 360,
            strength:
              Math.max(0, 1 - edgeDistance / 600) ** 2 *
              Math.min(1, distance / Math.max(1, Math.max(rect.width, rect.height) * 0.25)) ** 2,
          };
        });
        surfaces.forEach((surface, index) => {
          surface.style.setProperty('--angle', `${lighting[index].angle}deg`);
          surface.style.setProperty('--strength', lighting[index].strength);
        });
        dot.style.left = `${source.x - area.left}px`;
        dot.style.top = `${source.y - area.top}px`;
      }

      function schedule() {
        if (!frame) frame = requestAnimationFrame(render);
      }
      stage.addEventListener('pointermove', (event) => {
        point = { x: event.clientX, y: event.clientY };
        schedule();
      });
      stage.addEventListener('pointerdown', (event) => {
        point = { x: event.clientX, y: event.clientY };
        schedule();
      });
      document.querySelectorAll('input[name="direction"]').forEach((input) => {
        input.addEventListener('change', () => {
          mode = input.value;
          description.textContent =
            mode === 'toward'
              ? '밝은 면이 마우스를 향합니다. 카드 사이로 마우스를 움직여 보세요.'
              : '밝은 면이 마우스 반대쪽을 향합니다. 카드 사이로 마우스를 움직여 보세요.';
          schedule();
        });
      });
      window.addEventListener('resize', schedule);
      window.addEventListener('scroll', schedule, { passive: true });
      schedule();
    </script>
  </body>
</html>
